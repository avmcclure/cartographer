name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site from the sample atlas
        run: |
          dotnet run --project src/Cartographer.Cli -c Release -- site prepare --atlas fixtures/sample-atlas --out site/data
          cd site && npm ci && npm run build
