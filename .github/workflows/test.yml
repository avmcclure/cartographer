name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site from the sample atlas
        run: |
          dotnet run --project src/Cartographer.Cli -c Release -- site prepare --atlas fixtures/sample-atlas --out site/data
          cd site && npm ci && npm run build
      - name: Build the site from a generated Fortune 500-sized atlas
        run: |
          python3 tools/make-enterprise-atlas.py "$RUNNER_TEMP/kestrel"
          dotnet run --project src/Cartographer.Cli -c Release -- check --atlas "$RUNNER_TEMP/kestrel"
          rm -rf site/data
          dotnet run --project src/Cartographer.Cli -c Release -- site prepare --atlas "$RUNNER_TEMP/kestrel" --out site/data
          cd site && npm run build
